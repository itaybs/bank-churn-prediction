<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chief Retention Officer</title>
<style>
:root {
  --bg1: #0b1020; --bg2: #1a1240; --bg3: #0d2a3a;
  --glass: rgba(255,255,255,0.07); --glass-strong: rgba(255,255,255,0.12); --stroke: rgba(255,255,255,0.16);
  --text: #f4f6fb; --muted: #aab3c8; --faint: #7d87a0;
  --red: #ff5d6c; --amber: #ffb547; --green: #3ddc97; --blue: #5aa9ff; --violet: #a68bff;
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; max-width: 100%; }
img, svg, canvas { max-width: 100%; }
#app { width: 100%; max-width: 1480px; margin: 0 auto; }
.board > *, .hud > *, .controls > *, .lower > *, .two > *, .kpis > *, .compare > *, .chapter-grid > *, .scale-grid > * { min-width: 0; }
body {
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--text);
  background: radial-gradient(1200px 600px at 10% -10%, rgba(90,169,255,0.25), transparent 60%),
              radial-gradient(900px 500px at 110% 10%, rgba(166,139,255,0.28), transparent 60%),
              radial-gradient(800px 600px at 50% 120%, rgba(61,220,151,0.16), transparent 60%),
              linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  padding: 18px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere;
}
button { font-family: inherit; }
.glass { background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--radius);
         backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
         box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08); }
.screen { display: none; animation: fadeIn .5s ease both; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,93,108,.55); } 50% { box-shadow: 0 0 22px 4px rgba(255,93,108,.35); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1 { font-size: 30px; margin: 6px 0 8px; letter-spacing: -.01em; }
h2 { font-size: 22px; margin: 4px 0 10px; }
.lead { color: var(--muted); font-size: 16px; max-width: 900px; }
.btn { border: 1px solid var(--stroke); background: var(--glass-strong); color: var(--text); padding: 9px 14px;
       border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; transition: transform .12s, background .2s, box-shadow .2s; }
.btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, #5aa9ff, #a68bff); border-color: transparent; color: #0b1020;
               box-shadow: 0 6px 24px rgba(122,140,255,.45); }
.btn.big { padding: 13px 22px; font-size: 16px; border-radius: 14px; }
.btn.ghost { background: transparent; }

/* ---------- intro ---------- */
.intro { padding: 30px 34px; max-width: 1080px; margin: 0 auto; }
.chapter { display: none; animation: fadeIn .45s ease both; }
.chapter.active { display: block; }
.chapter-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 26px; align-items: center; margin-top: 10px; }
.visual { padding: 18px; }
.dots { display: flex; gap: 8px; margin: 22px 0 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.25); }
.dot.on { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.mini-bar { height: 14px; border-radius: 999px; background: rgba(255,255,255,.1); position: relative; overflow: visible; margin: 8px 0 22px; }
.mini-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), var(--amber), var(--red)); }
.tick { position: absolute; top: -6px; width: 2px; height: 26px; background: #fff; }
.tick span { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); font-size: 12px; white-space: nowrap; color: var(--muted); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--stroke); }
.stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-size: 24px; font-weight: 800; }
.stat .s { font-size: 12px; color: var(--faint); }

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 12px; }
.hud .cell { padding: 12px 14px; }
.hud .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.hud .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud .s { font-size: 12px; color: var(--faint); }
.hud .v.good { color: var(--green); text-shadow: 0 0 18px rgba(61,220,151,.35); }
.hud .v.bad { color: var(--red); text-shadow: 0 0 18px rgba(255,93,108,.35); }
.budget-track { height: 6px; background: rgba(255,255,255,.1); border-radius: 999px; margin-top: 6px; overflow: hidden; }
.budget-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--violet)); transition: width .35s ease; }

.controls { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; margin-bottom: 12px; }
.panel { padding: 14px 16px; }
.panel-title { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 12px; border-radius: 12px;
        border: 1px solid var(--stroke); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; transition: all .2s; min-width: 118px; }
.chip:hover { background: rgba(255,255,255,.12); }
.chip .n { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.chip .m { font-size: 11px; color: var(--muted); }
.chip .sw { width: 9px; height: 9px; border-radius: 50%; }
.chip.on { border-color: transparent; box-shadow: 0 0 0 2px var(--chip), 0 0 22px -2px var(--chip); background: rgba(255,255,255,.14); }
.slider-row { display: flex; align-items: center; gap: 12px; }
input[type=range] { flex: 1; accent-color: var(--violet); height: 26px; }
.tval { font-size: 22px; font-weight: 800; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
select { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid var(--stroke); border-radius: 10px; padding: 8px; font-family: inherit; }
select option { color: #0b1020; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* ---------- personas ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.card { position: relative; padding: 14px 14px 12px; cursor: pointer; transition: transform .2s, box-shadow .3s, border-color .3s; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-3px); }
.card.flagged { border-color: rgba(255,93,108,.55); }
.card.selected { box-shadow: 0 0 0 2px var(--blue), 0 12px 40px rgba(0,0,0,.4); }
.card.targeted { background: linear-gradient(180deg, rgba(166,139,255,.18), rgba(255,255,255,.06)); }
.card.flip { animation: flip .6s ease; }
.card.shake { animation: shake .35s ease; }
.bubble { position: relative; background: rgba(255,255,255,.92); color: #141a2e; border-radius: 14px; padding: 9px 11px; font-size: 13px;
          line-height: 1.35; min-height: 56px; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.bubble::after { content: ""; position: absolute; left: 26px; bottom: -8px; border: 8px solid transparent; border-top-color: rgba(255,255,255,.92); border-bottom: 0; }
.bubble.pop { animation: pop .35s ease; }
.who { display: flex; gap: 10px; align-items: center; }
.avatar { width: 54px; height: 54px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 30px;
          background: rgba(255,255,255,.1); border: 2px solid var(--ring, rgba(255,255,255,.3)); box-shadow: 0 0 16px -2px var(--ring, transparent); transition: all .3s; }
.name { font-weight: 800; font-size: 16px; }
.title { font-size: 12px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .03em; width: fit-content; }
.badge.red { background: rgba(255,93,108,.18); color: #ff9aa4; border: 1px solid rgba(255,93,108,.5); animation: pulse 1.8s infinite; }
.badge.amber { background: rgba(255,181,71,.16); color: #ffd08a; border: 1px solid rgba(255,181,71,.45); }
.badge.green { background: rgba(61,220,151,.15); color: #86f0c1; border: 1px solid rgba(61,220,151,.45); }
.risk { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.risk b { color: var(--text); font-size: 20px; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 10px; border-radius: 999px; background: rgba(255,255,255,.1); margin: 6px 0 4px; }
.fill { height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1), background .3s; }
.tmark { position: absolute; top: -5px; width: 2px; height: 20px; background: #fff; box-shadow: 0 0 8px #fff; transition: left .3s; }
.facts { font-size: 12px; color: var(--faint); margin: 6px 0 8px; min-height: 34px; }
.value { font-size: 12.5px; color: var(--muted); }
.value b { color: var(--text); }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: auto; padding-top: 10px; }
.act { padding: 7px 0; border-radius: 10px; border: 1px solid var(--stroke); background: rgba(255,255,255,.06); color: var(--text); cursor: pointer;
       font-size: 17px; transition: all .15s; position: relative; }
.act small { display: block; font-size: 10px; color: var(--muted); }
.act:hover:not(:disabled) { background: rgba(255,255,255,.16); }
.act.on { background: linear-gradient(135deg, rgba(90,169,255,.5), rgba(166,139,255,.55)); border-color: transparent; box-shadow: 0 0 14px rgba(166,139,255,.55); }
.act:disabled { opacity: .3; cursor: not-allowed; }
.result { margin-top: 10px; padding: 9px 10px; border-radius: 12px; font-size: 12.5px; font-weight: 600; display: none; animation: pop .4s ease both; }
.result.show { display: block; }
.result.tp { background: rgba(61,220,151,.16); border: 1px solid rgba(61,220,151,.5); }
.result.fp { background: rgba(255,181,71,.15); border: 1px solid rgba(255,181,71,.5); }
.result.fn { background: rgba(255,93,108,.16); border: 1px solid rgba(255,93,108,.5); }
.result.tn { background: rgba(90,169,255,.13); border: 1px solid rgba(90,169,255,.45); }

.lower { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-top: 12px; }
.scale-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.scale-grid .stat .v { font-size: 20px; }
.reveal-wrap { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 16px; }

/* ---------- debrief ---------- */
.overlay { display: none; margin-top: 14px; scroll-margin-top: 12px; }
.overlay.show { display: block; animation: fadeIn .35s ease both; }
.debrief { width: 100%; padding: 24px 26px; border-color: rgba(166,139,255,.45); box-shadow: 0 0 0 1px rgba(166,139,255,.25), 0 20px 60px rgba(0,0,0,.45); }
.verdict { display: flex; gap: 18px; align-items: center; }
.ring { width: 104px; height: 104px; flex: none; }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: rgba(255,255,255,.12); }
.ring .fg { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { fill: var(--text); font-size: 26px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
.win { color: var(--green); } .lose { color: var(--red); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.lessons { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.lessons li { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--stroke); font-size: 14px; }
.lessons li b { color: #fff; }
.mbars { display: grid; gap: 8px; margin-top: 6px; }
.mbar { display: grid; grid-template-columns: 150px 1fr 110px; gap: 10px; align-items: center; font-size: 13px; }
.mtrack { height: 14px; background: rgba(255,255,255,.08); border-radius: 999px; position: relative; overflow: hidden; }
.mfill { position: absolute; top: 0; bottom: 0; border-radius: 999px; transition: width .9s ease, left .9s ease; }
.mzero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: rgba(255,255,255,.5); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.foot { font-size: 12px; color: var(--faint); margin-top: 14px; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hud { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .controls, .lower { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  body { padding: 12px; }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chapter-grid, .two { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro { padding: 22px 20px; }
  h1 { font-size: 25px; }
  .verdict { flex-wrap: wrap; }
}
@media (max-width: 560px) {
  body { padding: 8px; font-size: 14px; }
  .scale-grid { grid-template-columns: 1fr; }
  .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .hud .v { font-size: 19px; }
  .hud .cell { padding: 10px 11px; }
  .hud .cell:last-child { grid-column: 1 / -1; }
  .compare { grid-template-columns: 1fr; }
  .intro { padding: 16px 14px; }
  h1 { font-size: 22px; } h2 { font-size: 18px; }
  .lead { font-size: 15px; }
  .chip { min-width: 0; flex: 1 1 140px; }
  .row .btn, .row select { flex: 1 1 140px; }
  .nav { flex-wrap: wrap; gap: 10px; }
  .nav > div { display: flex; gap: 8px; flex-wrap: wrap; }
  .debrief { padding: 16px 14px; }
  .ring { width: 84px; height: 84px; }
  .mbar { grid-template-columns: 1fr auto; row-gap: 4px; }
  .mbar .mtrack { grid-column: 1 / -1; grid-row: 2; }
  .act { padding: 9px 0; }  /* bigger touch targets */
}
@media (max-width: 480px) { .board { grid-template-columns: 1fr; } }
@media (max-width: 380px) {
  .kpis { grid-template-columns: 1fr; }
  .hud .v { font-size: 17px; }
}
@media (hover: none) { .card:hover, .btn:hover:not(:disabled) { transform: none; } }
/* ---------- right-to-left (Hebrew) ---------- */
[dir="rtl"] .bubble::after { left: auto; right: 26px; }
[dir="rtl"] .tval { text-align: left; }
[dir="rtl"] .eyebrow, [dir="rtl"] .panel-title, [dir="rtl"] .hud .k, [dir="rtl"] .stat .k, [dir="rtl"] .badge { letter-spacing: .02em; }
[dir="rtl"] .chip { align-items: flex-start; }
/* Scales, bars and money read left to right in Hebrew too. */
[dir="rtl"] .bar, [dir="rtl"] .mini-bar, [dir="rtl"] .mtrack, [dir="rtl"] .budget-track, [dir="rtl"] input[type=range] { direction: ltr; }
.num, .hud .v, .risk b, .tval { unicode-bidi: plaintext; }
</style>
</head>
<body>
<div id="app">

<!-- ======================= INTRO STORY ======================= -->
<section id="intro" class="screen active">
  <div class="intro glass">
    <div class="eyebrow" data-i18n="eyebrow">A machine learning decision story</div>
    <h1 data-i18n="title">🏦 The Chief Retention Officer</h1>
    <div id="chapters"></div>
    <div class="dots" id="dots"></div>
    <div class="nav">
      <button class="btn ghost" id="prevCh" data-i18n="back">← Back</button>
      <div>
        <button class="btn ghost" id="skipIntro" data-i18n="skip">Skip story</button>
        <button class="btn primary big" id="nextCh" data-i18n="next">Next →</button>
      </div>
    </div>
  </div>
</section>

<!-- ======================= GAME ======================= -->
<section id="game" class="screen">
  <div class="row" style="justify-content: space-between; margin: 0 0 10px;">
    <div><div class="eyebrow" id="weekLabel"></div><h2 style="margin:2px 0 0" data-i18n="deskTitle">Five customers are on your desk</h2></div>
    <div class="row" style="margin:0"><button class="btn ghost" id="replayStory" data-i18n="storyBtn">📖 Story</button></div>
  </div>

  <div class="hud">
    <div class="cell glass"><div class="k" data-i18n="hudBudget">Budget left</div><div class="v" id="hudBudget">$0</div>
      <div class="budget-track"><div class="budget-fill" id="budgetFill" style="width:0%"></div></div></div>
    <div class="cell glass"><div class="k" data-i18n="hudCommitted">Committed</div><div class="v" id="hudSpend">$0</div><div class="s" id="hudTargets"></div></div>
    <div class="cell glass"><div class="k" id="hudSaveK"></div><div class="v" id="hudSave">$0</div><div class="s" id="hudSaveS"></div></div>
    <div class="cell glass"><div class="k" id="hudRoiK"></div><div class="v" id="hudRoi">–</div><div class="s" id="hudRoiS"></div></div>
    <div class="cell glass"><div class="k" data-i18n="hudSeason">Season total</div><div class="v" id="hudSeason">$0</div><div class="s" data-i18n="hudSeasonS">net value over revealed weeks</div></div>
  </div>

  <div class="controls">
    <div class="panel glass">
      <div class="panel-title"><span data-i18n="crystal">🧠 Your crystal ball: choose a model</span><span id="modelNote"></span></div>
      <div class="chips" id="chips"></div>
      <div class="hint" id="modelHint"></div>
    </div>
    <div class="panel glass">
      <div class="panel-title"><span data-i18n="thresholdTitle">🎚️ Decision threshold</span><span id="tOpt"></span></div>
      <div class="slider-row"><input type="range" id="tSlider" min="0.05" max="0.95" step="0.01"><div class="tval" id="tVal">50%</div></div>
      <div class="row">
        <button class="btn" id="tModel" data-i18n="useOpt">Use model's optimum</button>
        <button class="btn" id="tDefault" data-i18n="default50">Default 50%</button>
        <select id="autoInc"></select>
        <button class="btn" id="autoTarget" data-i18n="targetAll">🎯 Target all flagged</button>
        <button class="btn ghost" id="clearAll" data-i18n="clear">Clear</button>
      </div>
      <div class="hint" data-i18n="thresholdHint"></div>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="lower">
    <div class="panel glass">
      <div class="panel-title"><span id="scaleTitle"></span><span id="scaleIncName"></span></div>
      <div class="scale-grid" id="scaleGrid"></div>
      <div class="hint" id="scaleHint"></div>
    </div>
    <div class="glass reveal-wrap">
      <div style="font-weight:700" data-i18n="readyText"></div>
      <button class="btn primary big" id="reveal"></button>
      <div class="hint" id="revealHint"></div>
    </div>
  </div>

  <!-- Debrief: shown inline below the board, so it works at any screen size and iframe height. -->
  <div class="overlay" id="overlay" aria-live="polite"><div class="debrief glass" id="debrief"></div></div>
</section>

<!-- ======================= FINAL ======================= -->
<section id="final" class="screen">
  <div class="intro glass" id="finalBody"></div>
</section>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddc97"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient></defs></svg>
</div>

</script>

<script>
(function () {
"use strict";
const DATA = /*__PAYLOAD__*/null;
const E = window.Engine;
const LANG = window.I18N[DATA.lang] ? DATA.lang : "en";
const L = window.I18N[LANG];
/* Text for key in the selected language (English fallback); functions receive the arguments. */
const T = (key, ...args) => { const v = key in L ? L[key] : window.I18N.en[key]; return typeof v === "function" ? v(...args) : v; };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (x, signed) => (x < 0 ? "−" : signed && x > 0 ? "+" : "") + "$" + Math.round(Math.abs(x)).toLocaleString("en-US");
const pct = (x, d = 0) => (100 * x).toFixed(d) + "%";
const econ = DATA.econ;
const incById = Object.fromEntries(econ.incentives.map((i) => [i.id, i]));
const modelByName = Object.fromEntries(DATA.models.map((m) => [m.name, m]));
const BUDGET = DATA.budget;
const names = (cs) => T("list", cs.map((c) => esc(c.name)));
const badgeText = ([icon, title, message]) => [icon, ...(L.badges[title] || [title, message])];

/* ---------------- tickers ---------------- */
const tickers = new Map();
function tick(el, to, fmt) {
  const from = tickers.get(el)?.to ?? 0;
  tickers.set(el, { to, fmt });
  // Animation frames are paused in hidden tabs: show the final value directly there.
  if (document.hidden) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 550;
  function step(now) {
    const k = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) tickers.forEach((v, el) => { el.textContent = v.fmt(v.to); });
});

  const at50 = E.scaleStats(g, 0.5, waiver), atOpt = E.scaleStats(g, best.threshold, waiver);

    incentives: econ.incentives.map((i) => ({ icon: esc(i.icon), name: esc(i.name), cost: money(i.cost), success: pct(i.success), blurb: esc(i.blurb) })),
    modelList: DATA.models.map((m) => `${esc(m.name)} <b>${m.cv_auc.toFixed(3)}</b>`).join(", "),

/* ---------------- game board ---------------- */
function riskState(p) {
  if (p >= state.t) return ["red", T("riskHigh")];
  if (p >= DATA.base_rate) return ["amber", T("riskWavering")];
  return ["green", T("riskLoyal")];
}
function riskColor(p) { return p >= state.t ? "var(--red)" : p >= DATA.base_rate ? "var(--amber)" : "var(--green)"; }

function renderChips() {
  $("chips").innerHTML = DATA.models.map((m) => `<button class="chip ${m.name === state.model ? "on" : ""}" style="--chip:${m.color}" data-model="${esc(m.name)}">
      <span class="n"><span class="sw" style="background:${m.color}"></span>${esc(m.name)}${m.name === DATA.best ? " ⭐" : ""}</span>
      <span class="m">${T("chipMeta", m.cv_auc.toFixed(3), pct(m.threshold))}</span></button>`).join("");

}
function switchModel(name) {

  state.model = name;
  if (!keepCustom) state.t = modelByName[name].threshold;

  renderChips(); updateBoard(true); updateScale();
}

      </div>

}
function say(i, text) {
  const b = $("bub" + i);
  b.textContent = text;
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
}
function select(i) {
  if (state.revealed) return;
  state.selected = i;
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("selected", Number(c.dataset.i) === i));
  say(i, customers()[i].lines.click);
}
function choose(i, inc) {
  if (state.revealed) return;
  const next = state.decisions.slice(); next[i] = inc;
  if (E.spend(next, econ) > BUDGET + 1e-9) {
    const card = $("card" + i); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    say(i, T("overBudget"));
    return;
  }
  state.decisions = next;
  say(i, inc === "none" ? customers()[i].lines.idle : customers()[i].lines[inc]);
  updateBoard(false); updateHud();
}
function updateBoard(fromModelSwitch) {
  const ps = probs();
  customers().forEach((c, i) => {
    const p = ps[i], [cls, label] = riskState(p), card = $("card" + i);
    card.classList.toggle("flagged", p >= state.t);
    card.classList.toggle("targeted", state.decisions[i] !== "none");
    const badge = $("badge" + i); badge.className = "badge " + cls; badge.textContent = label;
    $("av" + i).style.setProperty("--ring", riskColor(p));
    $("fill" + i).style.width = pct(p, 1); $("fill" + i).style.background = riskColor(p);
    $("tm" + i).style.left = pct(state.t, 1);
    tick($("rp" + i), p * 100, (v) => Math.round(v) + "%");
    $("acts" + i).querySelectorAll(".act").forEach((b) => {
      b.classList.toggle("on", b.dataset.inc === state.decisions[i]);
      b.disabled = state.revealed;
    });
  });
  $("tVal").textContent = pct(state.t);
  $("tOpt").textContent = T("optimumOf", state.model, pct(modelByName[state.model].threshold));
}
function updateHud() {
  const spent = E.spend(state.decisions, econ);
  tick($("hudBudget"), BUDGET - spent, (v) => money(v));
  $("budgetFill").style.width = pct(spent / BUDGET, 1);
  tick($("hudSpend"), spent, (v) => money(v));
  $("hudTargets").textContent = T("targeted", state.decisions.filter((d) => d !== "none").length);
  if (!state.revealed) {
    const exp = state.decisions.reduce((s, d, i) => s + probs()[i] * E.incentiveById(econ, d).success * values()[i], 0);
    $("hudSaveK").textContent = T("hudExpSave"); $("hudSaveS").textContent = T("hudExpSaveS", state.model);
    tick($("hudSave"), exp, (v) => money(v));
    $("hudRoiK").textContent = T("hudExpRoi"); $("hudRoiS").textContent = T("hudRoiS");
    const roi = spent ? (exp - spent) / spent : null;
    $("hudRoi").textContent = roi === null ? "–" : (roi >= 0 ? "+" : "") + pct(roi);
    $("hudRoi").className = "v " + (roi === null ? "" : roi >= 0 ? "good" : "bad");
  }
  const season = state.history.reduce((s, h) => s + h.you.net, 0);
  tick($("hudSeason"), season, (v) => money(v, true));
  $("hudSeason").className = "v " + (season > 0 ? "good" : season < 0 ? "bad" : "");
}
function updateScale() {
  const inc = incById[state.autoInc];
  const s = E.scaleStats(DATA.scale.models[state.model], state.t, inc);
  $("scaleTitle").textContent = T("scaleTitle", DATA.scale.n.toLocaleString("en-US"));
  $("scaleIncName").textContent = T("scaleIncName", inc.icon, inc.name);
  const cells = [
    [T("sFlagged"), s.flagged.toLocaleString("en-US"), T("sFlaggedS", s.tp, s.fp)],
    [T("sRecall"), pct(s.recall), T("sRecallS", s.tp, s.tp + s.fn)],
    [T("sPrecision"), pct(s.precision), T("sPrecisionS", s.tp, s.flagged)],
    [T("sWasted"), money(s.wasted), T("sWastedS", s.fp)],

  $("scaleGrid").innerHTML = cells.map(([k, v, sub], i) => `<div class="stat"><div class="k">${k}</div><div class="v num" style="${i === 5 ? `color:${s.net >= 0 ? "var(--green)" : "var(--red)"}` : ""}">${v}</div><div class="s">${sub}</div></div>`).join("");

}

$("tSlider").oninput = (e) => { state.t = Number(e.target.value); updateBoard(false); updateScale(); };
$("tModel").onclick = () => { state.t = modelByName[state.model].threshold; $("tSlider").value = state.t; updateBoard(false); updateScale(); };
$("tDefault").onclick = () => { state.t = 0.5; $("tSlider").value = 0.5; updateBoard(false); updateScale(); };
$("autoInc").innerHTML = econ.incentives.map((i) => `<option value="${i.id}" ${i.id === state.autoInc ? "selected" : ""}>${i.icon} ${esc(i.name)} (${money(i.cost)})</option>`).join("");
$("autoInc").onchange = (e) => { state.autoInc = e.target.value; updateScale(); };
$("autoTarget").onclick = () => {
  if (state.revealed) return;
  const ps = probs(), next = ps.map((p) => (p >= state.t ? state.autoInc : "none"));
  // Highest risk first if the budget cannot cover everyone flagged.
  const order = ps.map((p, i) => [p, i]).sort((a, b) => b[0] - a[0]).map((x) => x[1]);
  const plan = new Array(ps.length).fill("none"); let spent = 0;
  for (const i of order) { const c = E.incentiveById(econ, next[i]).cost; if (next[i] !== "none" && spent + c <= BUDGET) { plan[i] = next[i]; spent += c; } }
  state.decisions = plan;
  plan.forEach((d, i) => say(i, d === "none" ? customers()[i].lines.idle : customers()[i].lines[d]));
  updateBoard(false); updateHud();
};
$("clearAll").onclick = () => { if (state.revealed) return; state.decisions = customers().map(() => "none"); customers().forEach((c, i) => say(i, c.lines.idle)); updateBoard(false); updateHud(); };

/* ---------------- reveal & debrief ---------------- */
function lessons(you, ctx) {
  const out = [], cs = customers(), ps = probs(ctx.model), t = ctx.t;
  const missedByRule = cs.filter((c, i) => c.churned && ps[i] < t);
  if (missedByRule.length) {
    const lowest = Math.min(...missedByRule.map((c) => c.p[ctx.model]));
    out.push(T("lThreshold", pct(t), names(missedByRule), missedByRule.map((c) => pct(c.p[ctx.model])).join(", "),
                pct(Math.floor(lowest * 100) / 100), missedByRule.length > 1));
  }
  const falseFlags = cs.filter((c, i) => !c.churned && ps[i] >= t);
  if (falseFlags.length) out.push(T("lFalseFlags", names(falseFlags), falseFlags.length > 1));
  const fp = cs.filter((c, i) => state.decisions[i] !== "none" && !c.churned);
  if (fp.length) out.push(T("lWasted", money(you.wasted), names(fp)));
  const fn = cs.filter((c, i) => state.decisions[i] === "none" && c.churned);
  if (fn.length) out.push(T("lLost", money(fn.reduce((s, c) => s + c.value, 0)), names(fn)));
  // Model choice, this week: each model's own expected-value plan, scored on the real outcomes.
  const roundNets = DATA.models.map((m) => [m.name, E.summarise(E.bestPlan(probs(m.name), values(), econ, BUDGET), churned(), values(), econ).net]);
  const cur = roundNets.find((r) => r[0] === ctx.model)[1];
  const top = roundNets.reduce((a, b) => (b[1] > a[1] ? b : a));
  if (top[0] !== ctx.model && top[1] - cur > 0.5) out.push(T("lModelWeek", esc(top[0]), money(top[1] - cur), esc(ctx.model)));
  else out.push(T("lModelPaid", esc(ctx.model), money(cur, true)));
  // Model choice, at scale: each model at its own optimum, same incentive.
  const inc = incById[state.autoInc];
  const scaleNet = DATA.models.map((m) => [m.name, E.scaleStats(DATA.scale.models[m.name], m.threshold, inc).net]);
  const worst = scaleNet.reduce((a, b) => (b[1] < a[1] ? b : a)), best = scaleNet.reduce((a, b) => (b[1] > a[1] ? b : a));
  out.push(T("lScale", esc(inc.name), DATA.scale.n.toLocaleString("en-US"), money(best[1], true), esc(best[0]), money(worst[1], true), esc(worst[0])));
  return out;
}
function reveal() {
  if (state.revealed) return;
  state.revealed = true;
  const ctx = { model: state.model, t: state.t };
  const cs = customers(), v = values(), ch = churned();
  const you = E.summarise(state.decisions, ch, v, econ);
  const modelPlan = E.bestPlan(probs(), v, econ, BUDGET);
  const perfectPlan = E.bestPlan(ch.map((x) => (x ? 1 : 0)), v, econ, BUDGET);
  const modelRes = E.summarise(modelPlan, ch, v, econ), perfect = E.summarise(perfectPlan, ch, v, econ);
  const score = E.successScore(you.net, perfect.net);
  const [icon, title, message] = badgeText(E.badge(score, you.net));
  const entry = { week: state.week + 1, you, modelRes, perfect, score, title, icon, model: ctx.model, t: ctx.t, lessons: lessons(you, ctx) };
  state.history.push(entry);

  cs.forEach((c, i) => setTimeout(() => {
    const card = $("card" + i), res = $("res" + i), d = state.decisions[i], o = E.outcome(d, c.churned, c.value, econ);
    card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip");
    let cls, text;
    if (c.churned && d !== "none") { cls = "tp"; text = T("resTP", money(o.true_savings)); say(i, c.lines.left_targeted); }
    else if (c.churned) { cls = "fn"; text = T("resFN", money(o.lost_revenue)); say(i, c.lines.left); }
    else if (d !== "none") { cls = "fp"; text = T("resFP", money(o.wasted)); say(i, c.lines.stay_targeted); }
    else { cls = "tn"; text = T("resTN"); say(i, c.lines.stay); }
    res.className = "result show " + cls; res.textContent = text;
  }, 260 * i));

  setTimeout(() => {
    $("hudSaveK").textContent = T("hudRealSave"); $("hudSaveS").textContent = T("hudRealSaveS", money(you.wasted), money(you.lost_revenue));
    tick($("hudSave"), you.true_savings, (x) => money(x));
    $("hudRoiK").textContent = T("hudRealRoi"); $("hudRoiS").textContent = T("netShort", money(you.net, true));
    $("hudRoi").textContent = you.spend ? (you.roi >= 0 ? "+" : "") + pct(you.roi) : T("na");
    $("hudRoi").className = "v " + (you.net >= 0 ? "good" : "bad");
    updateBoard(false); updateHud();
    $("reveal").textContent = T("openDebrief"); $("reveal").onclick = () => openDebrief(entry, icon, title, message);
    $("revealHint").textContent = T("revealedHint");
  }, 260 * cs.length + 250);
  setTimeout(() => openDebrief(entry, icon, title, message), 260 * cs.length + 900);
}
function bars(rows) {
  const max = Math.max(1, ...rows.map((r) => Math.abs(r[1])));
  const hasNeg = rows.some((r) => r[1] < 0), zero = hasNeg ? 50 : 0, span = hasNeg ? 50 : 100;
  return `<div class="mbars">${rows.map(([name, v, color]) => {
    const w = (Math.abs(v) / max) * span, left = v >= 0 ? zero : zero - w;
    return `<div class="mbar"><span>${esc(name)}</span><div class="mtrack">${hasNeg ? `<div class="mzero" style="left:${zero}%"></div>` : ""}<div class="mfill" style="left:${left}%; width:0; background:${color}" data-w="${w}"></div></div><b class="num" style="text-align:end">${money(v, true)}</b></div>`;
  }).join("")}</div>`;
}
function openDebrief(entry, icon, title, message) {
  const won = entry.you.net > 0 && entry.score >= 60, last = state.week === DATA.rounds.length - 1;
  const roundNets = DATA.models.map((m) => [m.name, E.summarise(E.bestPlan(probs(m.name), values(), econ, BUDGET), churned(), values(), econ).net, m.color]);
  const C = 2 * Math.PI * 42;
  $("debrief").innerHTML = `
    <div class="eyebrow">${T("debEyebrow", entry.week, esc(entry.model), pct(entry.t))}</div>
    <div class="verdict">
      <svg class="ring" viewBox="0 0 104 104"><circle class="bg" cx="52" cy="52" r="42"/><circle class="fg" id="ringFg" cx="52" cy="52" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><text x="52" y="52">${entry.score}</text></svg>
      <div><h2 class="${won ? "win" : "lose"}" style="margin:0">${won ? T("victory") : T("defeat")} · ${icon} ${esc(title)}</h2>
        <div class="lead" style="font-size:15px">${esc(message)} ${T("scoreLine", entry.score)}</div></div>
    </div>
    <div class="kpis">
      <div class="stat"><div class="k">${T("kSavings")}</div><div class="v num" style="color:var(--green)">${money(entry.you.true_savings)}</div><div class="s">${T("kSavingsS")}</div></div>
      <div class="stat"><div class="k">${T("kWasted")}</div><div class="v num" style="color:var(--amber)">${money(entry.you.wasted)}</div><div class="s">${T("kWastedS")}</div></div>
      <div class="stat"><div class="k">${T("kLost")}</div><div class="v num" style="color:var(--red)">${money(entry.you.lost_revenue)}</div><div class="s">${T("kLostS")}</div></div>
      <div class="stat"><div class="k">${T("kRoi")}</div><div class="v num" style="color:${entry.you.net >= 0 ? "var(--green)" : "var(--red)"}">${entry.you.spend ? (entry.you.roi >= 0 ? "+" : "") + pct(entry.you.roi) : T("na")}</div><div class="s">${T("netShort", money(entry.you.net, true))}</div></div>
    </div>
    <div class="two">
      <div><div class="panel-title"><span>${T("weekTeaches")}</span></div><ul class="lessons">${entry.lessons.map((l) => `<li>${l}</li>`).join("")}</ul></div>
      <div>
        <div class="panel-title"><span>${T("youVs")}</span></div>
        ${bars([[T("you"), entry.you.net, "#5aa9ff"], [T("planOf", entry.model), entry.modelRes.net, modelByName[entry.model].color], [T("hindsight"), entry.perfect.net, "#8a8984"]])}
        <div class="panel-title" style="margin-top:16px"><span>${T("everyModel")}</span></div>
        ${bars(roundNets)}
        <div class="foot">${T("foot")}</div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end; margin-top:16px">
      <button class="btn ghost" id="closeDeb">${T("backBoard")}</button>
      <button class="btn primary big" id="nextWeek">${last ? T("finalBtn") : T("nextWeek")}</button>
    </div>`;
  $("overlay").classList.add("show");
  bringIntoView($("overlay"));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("ringFg").style.strokeDashoffset = C * (1 - entry.score / 100);
    document.querySelectorAll(".mfill").forEach((f) => (f.style.width = f.dataset.w + "%"));
  }));
  $("closeDeb").onclick = () => { $("overlay").classList.remove("show"); bringIntoView($("board")); };
  $("nextWeek").onclick = () => {
    $("overlay").classList.remove("show");
    if (last) finalReport(); else { startWeek(state.week + 1); bringIntoView($("game")); }
  };
}
function finalReport() {
  const H = state.history, net = H.reduce((s, h) => s + h.you.net, 0), avg = Math.round(H.reduce((s, h) => s + h.score, 0) / H.length);
  const perfect = H.reduce((s, h) => s + h.perfect.net, 0), model = H.reduce((s, h) => s + h.modelRes.net, 0);
  const wasted = H.reduce((s, h) => s + h.you.wasted, 0), lost = H.reduce((s, h) => s + h.you.lost_revenue, 0);
  const [icon, title, message] = badgeText(E.badge(avg, net));
  $("finalBody").innerHTML = `
    <div class="eyebrow">${T("seasonEyebrow", H.length)}</div>
    <h1>${icon} ${esc(title)}</h1>
    <p class="lead">${esc(message)} ${T("avgScore", avg)}</p>
    <div class="kpis">
      <div class="stat"><div class="k">${T("fYourNet")}</div><div class="v num" style="color:${net >= 0 ? "var(--green)" : "var(--red)"}">${money(net, true)}</div><div class="s">${T("fOver", H.length)}</div></div>
      <div class="stat"><div class="k">${T("fModels")}</div><div class="v num">${money(model, true)}</div><div class="s">${T("fModelsS")}</div></div>
      <div class="stat"><div class="k">${T("fHindsight")}</div><div class="v num">${money(perfect, true)}</div><div class="s">${T("fHindsightS")}</div></div>
      <div class="stat"><div class="k">${T("fWastedLost")}</div><div class="v num" style="font-size:19px">${money(wasted)} · ${money(lost)}</div><div class="s">${T("fWastedLostS")}</div></div>
    </div>
    <div class="panel-title"><span>${T("fiveThings")}</span></div>
    <ul class="lessons">${T("takeaways").map((x) => `<li>${x}</li>`).join("")}</ul>
    <div class="row" style="justify-content:flex-end; margin-top:16px"><button class="btn primary big" id="again">${T("playAgain")}</button></div>`;
  show("final");
  $("again").onclick = () => { state.history = []; startWeek(0); show("game"); };
}
function startWeek(w) {
  state.week = w; state.revealed = false; state.selected = null;
  state.decisions = customers().map(() => "none");
  $("weekLabel").textContent = T("weekOf", w + 1, DATA.rounds.length);
  $("reveal").textContent = T("revealBtn"); $("reveal").onclick = reveal;
  $("revealHint").textContent = T("revealHint");
  buildBoard(); renderChips(); updateBoard(false); updateHud(); updateScale();
  $("tSlider").value = state.t;
}

renderStory();
startWeek(0);
window.__game = { state, reveal, choose, switchModel, startWeek, DATA, LANG };  // for automated checks
})();
</script>
</body>
